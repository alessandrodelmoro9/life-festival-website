[tool.poetry]
name = "life-backend"
version = "0.1.0"
description = "RAG Chatbot Backend for LIFE Design Festival 2026"
authors = ["Gemini CLI"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
llama-index = "^0.14.22"
llama-index-retrievers-bm25 = "^0.5.0"
rank-bm25 = "^0.2.2"
python-dotenv = "^1.0.1"
pydantic = "^2.6.0"
llama-index-embeddings-openai = "^0.6.0"
slowapi = "^0.1.9"
cachetools = "^7.1.4"
llama-index-readers-file = "^0.6.0"
llama-index-llms-openai-like = "^0.7.2"
pydantic-settings = "^2.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
