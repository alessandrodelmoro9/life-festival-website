[tool.poetry]
name = "life-chatbot-demo"
version = "0.1.0"
description = "RAG Chatbot for LIFE Design Festival"
authors = ["User"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
streamlit = "^1.56.0"
langchain = "^0.3.0"
langchain-community = "^0.3.0"
langchain-google-genai = "^2.0.0"
faiss-cpu = "^1.8.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
markdown = "^3.0.0"
google-generativeai = "^0.8.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
